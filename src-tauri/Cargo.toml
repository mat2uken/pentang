[package]
name = "poc-app"
version = "0.1.0"
description = "Common Core PoC"
authors = ["poc"]
edition = "2024"

[lib]
name = "poc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
poc-core-ffi = { path = "../crates/poc-core-ffi" }
